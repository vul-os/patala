name: ci

# The full quality gate on every push to main and every PR.
#
# Job 1 (`check`) runs exactly what `make check` runs locally — formatting,
# clippy-as-error, the whole test suite in BOTH passes (the default workspace
# build, and the feature-gated build where patala-fiat's twenty processor
# adapters actually exist), and a warning-free doc build. The bar in CI and the
# bar on a contributor's machine are the same command.
#
# Job 2 (`python-binding`) executes the UniFFI surface for real: it builds the
# cdylib with a fiat adapter compiled in, generates the Python wrapper with this
# workspace's own bindgen, and runs the smoke test under a real interpreter.
# Without it, "the Python binding executed end-to-end" would be a claim nothing
# enforces. It needs only python3 — the bindings are UniFFI (a cdylib plus a
# generated ctypes wrapper), never pyo3, so there are no native headers and no
# build backend to install.
#
# Job 3 (`go-binding`) is the Go equivalent, and it is new. It used to be
# absent on the grounds that it needs `uniffi-bindgen-go` installed from git at
# a pinned tag plus a C toolchain — both true, and both just a couple of steps
# (see below), which was never a good enough reason for the Go binding cackle
# consumes to be the one binding no gate covered. It builds the cdylib with
# `--features fiat-all`, generates the Go bindings from it, and runs
# `patala-go/bindingtest` — including the WebhookStatus pinning, where
# `Unconfirmed` mapping to anything a consumer could read as payment is a
# money-correctness bug in cackle. `make test-fiat` fails when zero tests run,
# so this job cannot go green by doing nothing.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: make check
        run: make check

  python-binding:
    name: python binding (executed, not just compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: make smoke-python
        run: make smoke-python

  go-binding:
    name: go binding (executed, not just compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Pinned to the tag matching this workspace's `uniffi = 0.29.5`, exactly
      # as patala-go/README.md documents. uniffi-bindgen-go is versioned
      # against a specific uniffi-rs release; an unpinned install currently
      # builds v0.7.x (uniffi-rs 0.31) and cannot read this cdylib's metadata.
      # Cached on the tag so it is compiled once, not on every run.
      - name: Cache uniffi-bindgen-go
        id: cache-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-go
          key: uniffi-bindgen-go-v0.5.0+v0.29.5-${{ runner.os }}

      - name: Install uniffi-bindgen-go (pinned)
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: |
          cargo install --locked \
            --git https://github.com/NordSecurity/uniffi-bindgen-go \
            --tag v0.5.0+v0.29.5 uniffi-bindgen-go

      # ubuntu-latest already ships gcc, which is all cgo needs here; this
      # fails loudly rather than letting the link step produce a confusing
      # Go-shaped error if that ever stops being true.
      - name: Verify the toolchain cgo requires
        run: |
          cc --version
          uniffi-bindgen-go --version

      # Root `smoke-go` runs patala-go's `test-fiat` (cdylib built with
      # --features fiat-all, bindings regenerated from it, bindingtest run
      # through scripts/go-test-gate.sh) and then its `test` (the same suite
      # against a MockRail-only cdylib, which also exercises the
      # `//go:build fiat` exclusion actually working), plus gofmt.
      - name: make smoke-go
        run: make smoke-go

  site:
    name: docs + site (generated, chrome-checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Both of these existed but ran nowhere. A gate that lives only on a
      # developer's machine is checked only when somebody remembers.
      - name: make site-check
        run: make site-check

      # Every package manifest under sdks/ must declare the version in
      # /VERSION. They were checked by nobody until now, and it showed: llmux
      # shipped 0.1.7 with all six of its literal-carrying manifests still at
      # 0.1.0, openrate shipped 0.1.8 with its Rust crate at 0.1.0. A manifest
      # that lies about its version is what a registry, a lockfile and a
      # consumer's resolver all believe.
      #
      # --selftest first: it drifts a manifest, drifts a lockfile, deletes a
      # version field and adds an unlisted SDK, and requires each to be
      # refused. It mutates the real tree and restores it, because a copy would
      # not prove it reads the tree that ships.
      - name: SDK manifests all declare the released version
        run: |
          node scripts/check-sdk-versions.mjs --selftest
          node scripts/check-sdk-versions.mjs

  kotlin-binding:
    name: kotlin binding (compiled and run, not just generated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # kotlinc is not preinstalled on any runner image. Pinned, not `latest`,
      # so a compiler release cannot silently change what this gate means.
      - name: Install kotlinc (pinned)
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlin-compiler-2.1.0.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

      # This job exists because its absence let a real break ship: the
      # rail_class rename reached Go and Rust, missed Kotlin and Swift, and
      # `make check` stayed green because neither had a job. A local-only gate
      # is checked when someone remembers.
      - name: make smoke-kotlin
        run: make smoke-kotlin

  swift-binding:
    name: swift binding (compiled and run, not just generated)
    # macOS, not ubuntu: the generated Swift links the cdylib and the toolchain
    # here is Apple's. A Linux swift image would test a different target than
    # the one this SDK documents.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Verify the Swift toolchain
        run: swiftc --version

      - name: make smoke-swift
        run: make smoke-swift

  # The release tooling is exercised on every push, not only when a tag is
  # pushed. `.github/workflows/release.yml` runs perhaps twice a year; a
  # checksum guard that has quietly stopped failing is indistinguishable, from
  # a green pipeline, from one that works — and the first time anyone would
  # find out is the release itself.
  #
  # verify.sh's 24 cases stand up a synthetic origin that is broken in exactly
  # one way each and assert the exit code AND that a diagnostic was printed
  # ("aborted with no message" is the real-world bug being guarded against).
  # release-stage.sh's 6 cases cover the refusals that need no toolchain; the
  # four that need a built library are named in its output as NOT covered here
  # and run for real in the release job.
  release-tooling:
    name: release verifier + stager (failure matrices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n scripts/verify.sh
          bash -n scripts/release-stage.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh scripts/release-stage.sh

      - name: verify.sh — failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

      - name: release-stage.sh — failure matrix (no build needed)
        run: bash scripts/release-stage.sh --selftest

  c-abi:
    name: c abi (dlopened from C, not just compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # ubuntu-latest already ships gcc. This fails loudly rather than letting
      # scripts/ffi-ctest.sh be the place that discovers it is missing.
      - name: Verify the C toolchain
        run: cc --version

      # Two passes: the default mock-only library (the small, offline artifact
      # the README quotes a size for) and the everything-on fiat build, which is
      # where the optional patala-uniffi dependency and twenty processor
      # adapters are actually linked into the C surface.
      - name: make smoke-ffi
        run: make smoke-ffi

  rendered-contrast:
    name: text contrast measured from composited pixels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright is not vendored: this repo ships no npm tree for the site,
      # which is plain HTML/CSS with no build step. Installed here, for this
      # job only; --no-save keeps it out of the checkout.
      - name: Install Playwright (chromium only)
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright@1
          npx --yes playwright install --with-deps chromium

      # Measures WCAG AA from the composited pixels — cumulative ancestor
      # opacity, each background's alpha, then the text colour — rather than
      # from the hex values in the stylesheet, because a gate that reads colour
      # values cannot see a fade. In the sibling repos this exact check found a
      # tab strip at opacity:.72 sitting at 3.67:1, and a chip painted with a
      # theme token that was the wrong colour for the band it sat in.
      #
      # --selftest first: eight deliberate breakages, each required to be
      # refused, plus a positive control — a gate that refuses everything
      # refuses every mutation too.
      - name: Every visible string clears WCAG AA, composited
        run: |
          node scripts/check-contrast-rendered.mjs --selftest
          node scripts/check-contrast-rendered.mjs
