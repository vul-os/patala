<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="Diagram: four consumers — Rust, Python, Go, HTTP — all reach every rail through the one PaymentRail trait, never directly.">
  <title>One interface, many rails — M×1, never M×N</title>
  <rect width="860" height="380" rx="18" fill="#0d1220"/>

  <!-- connecting lines: consumers -> hub -->
  <g fill="none" stroke="#3a4470" stroke-width="2">
    <path d="M190,82 C 270,82 270,190 355,190"/>
    <path d="M190,154 C 280,154 280,190 355,190"/>
    <path d="M190,226 C 280,226 280,190 355,190"/>
    <path d="M190,298 C 270,298 270,190 355,190"/>
  </g>
  <!-- connecting lines: hub -> rails -->
  <g fill="none" stroke="#3a4470" stroke-width="2">
    <path d="M505,190 C 585,190 585,79 670,79"/>
    <path d="M505,190 C 590,190 590,153 670,153"/>
    <path d="M505,190 C 590,190 590,227 670,227"/>
    <path d="M505,190 C 585,190 585,301 670,301"/>
  </g>

  <!-- left column: consumers -->
  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15">
    <g>
      <rect x="40" y="58" width="150" height="48" rx="10" fill="#1a2140" stroke="#3a4470"/>
      <text x="115" y="87" fill="#eef1f8" text-anchor="middle">Rust</text>
    </g>
    <g>
      <rect x="40" y="130" width="150" height="48" rx="10" fill="#1a2140" stroke="#3a4470"/>
      <text x="115" y="159" fill="#eef1f8" text-anchor="middle">Python</text>
    </g>
    <g>
      <rect x="40" y="202" width="150" height="48" rx="10" fill="#1a2140" stroke="#3a4470"/>
      <text x="115" y="231" fill="#eef1f8" text-anchor="middle">Go</text>
    </g>
    <g>
      <rect x="40" y="274" width="150" height="48" rx="10" fill="#1a2140" stroke="#3a4470"/>
      <text x="115" y="303" fill="#eef1f8" text-anchor="middle">HTTP (sidecar)</text>
    </g>
  </g>
  <text x="115" y="38" fill="#6b7396" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" letter-spacing="1.5">CONSUMERS</text>

  <!-- centre: the trait -->
  <rect x="355" y="135" width="150" height="110" rx="14" fill="#f06b3d"/>
  <text x="430" y="180" fill="#151c33" text-anchor="middle" font-family="'Familjen Grotesk',system-ui,sans-serif" font-size="17" font-weight="600">PaymentRail</text>
  <text x="430" y="200" fill="#151c33" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11">one trait</text>
  <text x="430" y="217" fill="#151c33" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11">written once</text>

  <!-- right column: rails -->
  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14">
    <g>
      <rect x="670" y="55" width="150" height="48" rx="10" fill="#1a2140" stroke="#34b87a"/>
      <text x="745" y="75" fill="#eef1f8" text-anchor="middle">Solana</text>
      <text x="745" y="92" fill="#34b87a" text-anchor="middle" font-size="10">non-custodial · final</text>
    </g>
    <g>
      <rect x="670" y="129" width="150" height="48" rx="10" fill="#1a2140" stroke="#34b87a"/>
      <text x="745" y="149" fill="#eef1f8" text-anchor="middle">Stellar</text>
      <text x="745" y="166" fill="#34b87a" text-anchor="middle" font-size="10">non-custodial · final</text>
    </g>
    <g>
      <rect x="670" y="203" width="150" height="48" rx="10" fill="#1a2140" stroke="#6c8ff5"/>
      <text x="745" y="223" fill="#eef1f8" text-anchor="middle">Hyperswitch</text>
      <text x="745" y="240" fill="#6c8ff5" text-anchor="middle" font-size="10">custodial · reversible</text>
    </g>
    <g>
      <rect x="670" y="277" width="150" height="48" rx="10" fill="#1a2140" stroke="#6b7396"/>
      <text x="745" y="297" fill="#eef1f8" text-anchor="middle">Mock</text>
      <text x="745" y="314" fill="#6b7396" text-anchor="middle" font-size="10">offline default</text>
    </g>
  </g>
  <text x="745" y="38" fill="#6b7396" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" letter-spacing="1.5">RAILS</text>

  <text x="430" y="358" fill="#a9b1cf" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12">M×1, never M×N — every adapter is written once, every consumer reaches every rail through the same trait.</text>
</svg>
