[package]
name = "patala-fiat"
version = "0.1.0"
edition = "2021"
description = "patala fiat foundation: the ISO-4217 minor-unit currency table, the provider-registry pattern (manual always-on/never-disableable), the offline `manual` PaymentRail, and two pilot CustodialReversible adapters (Stripe, Paystack) -- ported from cackle's internal/money + internal/payments (Go). Money-critical logic (currency exponents, amount conversions, fail-closed verify, webhook HMAC) is preserved faithfully; only the seam differs (patala-core's PaymentRail trait vs cackle's Provider interface). See PORTING.md."
license = "MIT"
repository = "https://github.com/vul-os/patala"
keywords = ["payments", "fiat", "stripe", "paystack", "custodial"]
categories = ["cryptography", "network-programming"]

# This crate stays IN the workspace `default-members` (see the root
# Cargo.toml) because its DEFAULT feature set is empty: the currency table,
# the registry, and the `manual` (no-network) rail compile and test with no
# optional dependency at all. `stripe` and `paystack` are separate,
# opt-in Cargo features that pull in reqwest/hmac/sha2/hex -- never on by
# default, so `cargo build`/`cargo test` at the workspace root never links
# them (PATALA.md §8, §9).
[features]
default = []
stripe = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
paystack = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
# Adyen's webhook HMAC signature is base64-encoded (not hex, unlike every
# other adapter in this crate) -- see adyen/webhook.rs -- hence the extra
# dep:base64, gated to this feature only.
adyen = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex", "dep:base64"]
checkoutcom = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
# Mollie's classic webhook carries NO signature at all -- see mollie/webhook.rs
# -- so this feature needs no HMAC/hex deps, only reqwest.
mollie = ["dep:reqwest"]
mercadopago = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
flutterwave = ["dep:reqwest"]
iyzico = ["dep:reqwest", "dep:sha1", "dep:base64"]
midtrans = ["dep:reqwest", "dep:sha2", "dep:hex"]
yoco = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:base64"]
payfast = ["dep:reqwest", "dep:md5"]
payu = ["dep:reqwest", "dep:sha2", "dep:hex", "dep:url"]
razorpay = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
square = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:base64"]
xendit = ["dep:reqwest"]
btcpay = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
lnbits = ["dep:reqwest"]
opennode = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
coinbasecommerce = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
paypal = ["dep:reqwest"]

[dependencies]
patala-core = { path = "../patala-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
sha1 = { version = "0.10", optional = true }
md5 = { version = "0.7", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6"
