[package]
name = "patala-py"
version = "0.1.1"
edition = "2021"
description = "Python packaging of patala's one UniFFI surface (patala-uniffi). See PATALA.md §5: adapters are written once in Rust; this crate is the Python consumer of that one core. MockRail always available; SolanaRail/StellarRail/HyperswitchRail behind --features solana/stellar/hyperswitch."
license = "MIT OR Apache-2.0"
publish = false

# `cdylib` is the artifact Python actually loads (via ctypes, through the
# UniFFI-generated wrapper module). It carries `patala-uniffi`'s scaffolding
# and metadata: rustc re-exports a linked rlib's `#[no_mangle]` symbols from a
# cdylib, which is exactly what UniFFI's scaffolding is made of. `lib` is kept
# so `cargo test -p patala-py` can run this crate's own tests — see
# `tests/scaffolding.rs`, which asserts that re-export empirically instead of
# assuming it.
[lib]
name = "patala_py"
crate-type = ["cdylib", "lib"]

# `uniffi-bindgen` is a tiny binary that just calls into the `uniffi` crate's
# own bindgen entrypoint. It exists so bindings can be generated with
# `cargo run -p patala-py --bin uniffi-bindgen` — no separately installed
# `uniffi-bindgen` CLI, no `maturin`, required. Kept in THIS crate (as well as
# in patala-uniffi) because the root Makefile's `smoke-python` target and
# maturin both drive the Python generation from here.
#
# `doc = false` because patala-uniffi ships a binary of the same name and
# `cargo doc --workspace` refuses to write two `uniffi-bindgen` docs to one
# path. patala-uniffi's is the documented one — it is the canonical home of the
# surface; this is its Python-side twin, kept so the Python flow needs no
# knowledge of the crate split.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["uniffi/cli"]
doc = false

[dependencies]
# THE dependency: the one `#[uniffi::export]` surface, namespaced "patala".
# Nothing in this crate re-declares any of it — see src/lib.rs.
patala-uniffi = { path = "../patala-uniffi" }
# Needed only for the `uniffi-bindgen` binary above (`uniffi::uniffi_bindgen_main`).
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
# tests/scaffolding.rs drives a rail through the re-exported surface.
patala-core = { path = "../patala-core" }

[features]
default = []
# Every feature below is a pure forwarder to the identically-named feature on
# `patala-uniffi`, which is where the rails are actually gated. They are
# repeated here rather than dropped so that building the Python wheel with a
# rail compiled in is still `maturin build --features fiat-stripe`, exactly as
# before this crate was split — and `scripts/check-features.sh` fails the
# build if any `fiat-<name>` stops forwarding.
solana = ["patala-uniffi/solana"]
stellar = ["patala-uniffi/stellar"]
hyperswitch = ["patala-uniffi/hyperswitch"]

fiat = ["patala-uniffi/fiat"]
fiat-adyen = ["patala-uniffi/fiat-adyen"]
fiat-btcpay = ["patala-uniffi/fiat-btcpay"]
fiat-checkoutcom = ["patala-uniffi/fiat-checkoutcom"]
fiat-coinbasecommerce = ["patala-uniffi/fiat-coinbasecommerce"]
fiat-flutterwave = ["patala-uniffi/fiat-flutterwave"]
fiat-iyzico = ["patala-uniffi/fiat-iyzico"]
fiat-lnbits = ["patala-uniffi/fiat-lnbits"]
fiat-mercadopago = ["patala-uniffi/fiat-mercadopago"]
fiat-midtrans = ["patala-uniffi/fiat-midtrans"]
fiat-mollie = ["patala-uniffi/fiat-mollie"]
fiat-opennode = ["patala-uniffi/fiat-opennode"]
fiat-payfast = ["patala-uniffi/fiat-payfast"]
fiat-paypal = ["patala-uniffi/fiat-paypal"]
fiat-payu = ["patala-uniffi/fiat-payu"]
fiat-paystack = ["patala-uniffi/fiat-paystack"]
fiat-razorpay = ["patala-uniffi/fiat-razorpay"]
fiat-square = ["patala-uniffi/fiat-square"]
fiat-stripe = ["patala-uniffi/fiat-stripe"]
fiat-xendit = ["patala-uniffi/fiat-xendit"]
fiat-yoco = ["patala-uniffi/fiat-yoco"]
fiat-all = ["patala-uniffi/fiat-all"]
