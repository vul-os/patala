[package]
name = "patala-solana"
version = "0.1.0"
edition = "2021"
description = "patala rail #2: SPL-USDC on Solana. NonCustodialFinal, wallet-to-wallet, real Ed25519 signing + transaction construction + JSON-RPC. Ported from magnetite-seams/src/solana (PATALA.md §4, §7)."
license = "MIT"
repository = "https://github.com/vul-os/patala"
keywords = ["payments", "non-custodial", "solana", "spl", "usdc"]
categories = ["cryptography", "network-programming"]

# NOTE: this crate is NOT part of the workspace's `default-members` (see the
# root Cargo.toml). It carries real network + crypto dependencies on purpose —
# `cargo build` / `cargo test` at the workspace root never pulls it in; only
# `cargo build -p patala-solana` (or `--features solana` on a consumer that
# depends on it) does. `patala-core` alone stays the offline, dep-free default
# (PATALA.md §8).

[dependencies]
patala-core = { path = "../patala-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex = "0.4"
blake3 = "1"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
sha2 = "0.10"
curve25519-dalek = "4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
