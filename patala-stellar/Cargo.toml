[package]
name = "patala-stellar"
version = "0.1.1"
edition = "2021"
description = "patala rail #3: native Circle USDC on Stellar. NonCustodialFinal, wallet-to-wallet, real Ed25519 signing + XDR transaction construction + Horizon submission/verification (PATALA.md §4, §6). One payment settled on Stellar TESTNET 2026-07-30; mainnet + multi-party unverified — see README."
license = "MIT OR Apache-2.0"
repository = "https://github.com/vul-os/patala"
keywords = ["payments", "non-custodial", "stellar", "usdc", "xdr"]
categories = ["cryptography", "network-programming"]

# NOTE: this crate is NOT part of the workspace's `default-members` (see the
# root Cargo.toml), exactly like its sibling `patala-solana`. It carries real
# network + crypto dependencies on purpose — `cargo build`/`cargo test` at the
# workspace root never pulls it in; only `cargo build -p patala-stellar` does.
# `patala-core` alone stays the offline, dep-free default (PATALA.md §8).
#
# Dependency choice (see README.md "Honesty" section for the full rationale):
# `stellar-xdr` and `stellar-strkey` are the Stellar Development Foundation's
# own crates, generated directly from the same `.x` XDR definitions used by
# stellar-core — Apache-2.0, permissively licensed, and they remove an entire
# class of hand-XDR bugs. This crate still builds and signs the transaction
# envelope itself (source account, operation, memo, fee, sequence number,
# signature base, network ID) using those official *codec* types — it is not
# a full high-level "Stellar SDK" that would build/submit/poll on our behalf.

[dependencies]
patala-core = { path = "../patala-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
stellar-strkey = "0.0.8"
# Already in the tree transitively (ed25519-dalek pulls it in), so naming it
# directly adds no crate to the graph. `SigningKey` wipes the seed it keeps;
# this is for the intermediate copies `keys.rs` makes on the way there — the
# `S...` StrKey text out of the environment, and the decoded seed array.
zeroize = "1"
stellar-xdr = { version = "22", features = ["curr", "base64"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
