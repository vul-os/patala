  body{background:var(--ink-950);color:var(--bone);font-family:var(--mono);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

  .disp{font-family:var(--disp);font-weight:700;letter-spacing:-.02em}

  /* Docs shell */
  .docs-shell{display:grid;grid-template-columns:250px 1fr;gap:34px;align-items:start;padding:36px 0 80px}
  @media(max-width:860px){.docs-shell{grid-template-columns:1fr}}
  .docs-nav{position:sticky;top:84px;border:1px solid var(--line);background:var(--ink-850);padding:16px 14px;position:relative}
  .docs-nav::before{content:'';position:absolute;top:-1px;left:-1px;width:9px;height:9px;border-top:1px solid var(--signal);border-left:1px solid var(--signal)}
  .docs-nav .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--bone-faint);padding:4px 10px 12px}
  .docs-nav a{display:block;padding:8px 11px;color:var(--bone-dim);font-size:13.5px;font-weight:500;transition:.15s;border-left:2px solid transparent}
  .docs-nav a:hover{background:rgba(255,255,255,.03);color:var(--bone)}
  .docs-nav a.active{background:color-mix(in srgb,var(--signal) 12%, transparent);color:var(--bone);border-left-color:var(--signal)}
  @media(max-width:860px){.docs-nav{position:static}}
  .docs-main{min-width:0}
  .docs-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-faint);margin-bottom:10px}
  .markdown{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;font-size:16px;color:#D9E0DC}
  .markdown>*:first-child{margin-top:0}
  .markdown h1{font-family:var(--disp);font-size:32px;letter-spacing:-.02em;margin:.2em 0 .5em;border-bottom:1px solid var(--line);padding-bottom:.3em;color:var(--bone)}
  .markdown h2{font-family:var(--disp);font-size:23px;letter-spacing:-.01em;margin:1.6em 0 .6em;border-bottom:1px solid var(--line);padding-bottom:.25em;color:var(--bone)}
  .markdown h3{font-family:var(--disp);font-size:18px;margin:1.4em 0 .5em;color:var(--bone)}
  .markdown h4{font-size:15px;margin:1.3em 0 .4em;color:var(--bone)}
  .markdown p,.markdown li{color:#D9E0DC}
  .markdown strong{color:var(--bone)}

  footer{border-top:1px solid var(--line);padding:46px 0;text-align:center;color:var(--bone-faint);font-size:12px}

<script>
// The site is served statically; docs render straight from this repo's own markdown.
const DOCS = [
  {"slug":"overview","title":"Overview","path":"./docs/overview.md"},
  {"slug":"rails","title":"The rails & interface","path":"./docs/rails-interface.md"},
  {"slug":"self-host","title":"Self-host & vendor","path":"./docs/self-host-vendor.md"},
  {"slug":"status","title":"Status","path":"./docs/status.md"}
];
const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
const byFile = Object.fromEntries(DOCS.map(d=>[d.path.split('/').pop().toLowerCase(),d]));
const content = document.getElementById('content');
const crumb = document.getElementById('crumb');

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

function setActive(slug){
  document.querySelectorAll('.docs-nav a').forEach(a=>a.classList.toggle('active', a.dataset.slug===slug));
}

async function load(slug){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.textContent = doc.title;
  content.innerHTML = 'Loading…';
  try {
    const res = await fetch(doc.path, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    // Cross-doc links become sidebar navigation.
    content.querySelectorAll('a[href]').forEach(a=>{
      const h=a.getAttribute('href')||'';
      if(/^(https?:|#|mailto:)/i.test(h)) return;
      const m=h.match(/([^\/]+\.md)(#.*)?$/i);
      const target = m && byFile[m[1].toLowerCase()];
      if(target) a.setAttribute('href','#'+target.slug);
    });
    content.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
    window.scrollTo({top:0});
  } catch(err){
    content.innerHTML = '<div class="docs-error">Could not load <code>'+doc.path.split('/').pop()+'</code> — '+err.message+'</div>';
  }
}

function current(){ return (location.hash||'').replace('#','') || DOCS[0].slug; }
window.addEventListener('hashchange', ()=>load(current()));
load(current());
</script>
