<script>
(function(){
  // Mark the document script-capable BEFORE first paint, so the reveal
  // animation (html.js .rv, patala.css) only ever hides content that some
  // JavaScript is actually going to bring back.
  document.documentElement.classList.add('js');
  try{
    var KEY='patala-theme';
    var stored=localStorage.getItem(KEY);
    var theme=stored==='light'||stored==='dark'?stored:
      ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){document.documentElement.setAttribute('data-theme','dark');}
})();

<script>
// The site is served statically; docs render straight from this repo's own markdown.
const DOCS = [
  {"slug":"overview","title":"Overview","path":"./docs/overview.md"},
  {"slug":"rails","title":"The rails & interface","path":"./docs/rails-interface.md"},
  {"slug":"self-host","title":"Self-host & vendor","path":"./docs/self-host-vendor.md"},
  {"slug":"status","title":"Status","path":"./docs/status.md"}
];
const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
const byFile = Object.fromEntries(DOCS.map(d=>[d.path.split('/').pop().toLowerCase(),d]));
const content = document.getElementById('content');
const crumb = document.getElementById('crumb');
const pager = document.getElementById('pager');

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

function setActive(slug){
  document.querySelectorAll('.docs-nav a').forEach(a=>a.classList.toggle('active', a.dataset.slug===slug));
}

// Every table marked.js renders gets its own horizontal scroller (never the
// whole page) — same fix as .ledger-wrap on the landing, for the same reason
// (PaymentRail's method table and the destination-status table are both
// genuinely wide). Every fenced code block gets re-parented into the shared
// .codeblock/.cb-head chrome and then highlighted for real.
function dressContent(){
  content.querySelectorAll('table').forEach(function(table){
    if (table.closest('.table-scroll')) return;
    var wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
  content.querySelectorAll('pre').forEach(function(pre){
    var code = pre.querySelector('code');
    if (!code) return;
    var m = (code.className||'').match(/language-([\w-]+)/);
    var lang = m ? m[1] : 'text';
    if (window.hljs){
      try { hljs.highlightElement(code); } catch(e){}
    }
    var box = document.createElement('div');
    box.className = 'codeblock';
    var head = document.createElement('div');
    head.className = 'cb-head';
    // The same header the landing hand-writes: an achromatic language chip
    // with an original glyph, then a copy control that really copies. Only the
    // five languages this site actually ships have a drawn glyph; anything
    // else falls back to the chip's word alone rather than a wrong picture.
    var GLYPH = { rust:'rust', python:'python', py:'python', go:'go',
                  golang:'go', toml:'toml', ini:'toml', bash:'shell',
                  sh:'shell', shell:'shell', console:'shell' };
    var sym = GLYPH[lang];
    head.innerHTML =
      '<span class="lang">' +
        (sym ? '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#lg-'+sym+'"/></svg>' : '') +
        lang +
      '</span>' +
      '<span class="cb-path"></span>' +
      '<button class="cb-copy" type="button" aria-label="Copy this code">' +
        '<span class="idle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M15 5.6A2.6 2.6 0 0 0 12.4 3H6.6A3.6 3.6 0 0 0 3 6.6v5.8A2.6 2.6 0 0 0 5.6 15"/></svg>Copy</span>' +
        '<span class="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.6 9.4 17.5 19.5 6.8"/></svg>Copied</span>' +
      '</button>';
    pre.parentNode.insertBefore(box, pre);
    box.appendChild(head);
    box.appendChild(pre);
  });
}

function renderPager(slug){
  var i = DOCS.findIndex(function(d){ return d.slug===slug; });
  pager.innerHTML = '';
  if (i > 0){
    var prev = DOCS[i-1];
    var a = document.createElement('a');
    a.className = 'prev'; a.href = '#'+prev.slug;
    a.innerHTML = '<span class="lbl">&larr; previous</span><span class="ttl">'+prev.title+'</span>';
    pager.appendChild(a);
  }
  if (i >= 0 && i < DOCS.length-1){
    var next = DOCS[i+1];
    var b = document.createElement('a');
    b.className = 'next'; b.href = '#'+next.slug;
    b.innerHTML = '<span class="lbl">next &rarr;</span><span class="ttl">'+next.title+'</span>';
    pager.appendChild(b);
  }
}

async function load(slug){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.innerHTML = 'patala docs<span class="sep">/</span>'+doc.title;
  content.innerHTML = 'Loading…';
  try {
    const res = await fetch(doc.path, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    // Cross-doc links become sidebar navigation.
    content.querySelectorAll('a[href]').forEach(a=>{
      const h=a.getAttribute('href')||'';
      if(/^(https?:|#|mailto:)/i.test(h)) return;
      const m=h.match(/([^\/]+\.md)(#.*)?$/i);
      const target = m && byFile[m[1].toLowerCase()];
      if(target) a.setAttribute('href','#'+target.slug);
    });
    content.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
    dressContent();
    renderPager(doc.slug);
    window.scrollTo({top:0});
  } catch(err){
    content.innerHTML = '<div class="docs-error">Could not load <code>'+doc.path.split('/').pop()+'</code> — '+err.message+'</div>';
    pager.innerHTML = '';
  }
}

function current(){ return (location.hash||'').replace('#','') || DOCS[0].slug; }
window.addEventListener('hashchange', ()=>load(current()));
load(current());

(function(){
  var btn=document.getElementById('themeToggle');
  var sun=btn.querySelector('.icon-sun'), moon=btn.querySelector('.icon-moon');
  function sync(){
    var t=document.documentElement.getAttribute('data-theme');
    var isLight=t==='light';
    sun.style.display=isLight?'none':'block';
    moon.style.display=isLight?'block':'none';
    btn.setAttribute('aria-pressed', String(isLight));
    btn.setAttribute('aria-label', isLight?'Switch to dark theme':'Switch to light theme');
  }
  sync();
  btn.addEventListener('click', function(){
    var next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('patala-theme', next); }catch(e){}
    sync();
  });
})();
// Copy-to-clipboard on every code block. Wired from the DOM rather than
// hard-coded per block, so docs.html's generated blocks get it too by simply
// including this file's twin. Reads the ORIGINAL text via textContent, which
// is the un-highlighted source (highlight.js only wraps it in spans), so what
// lands on the clipboard is exactly what is on screen and nothing else.
// execCommand is kept as the fallback path because navigator.clipboard is
// unavailable on a plain http:// origin in some browsers, and a copy button
// that silently does nothing is worse than no copy button.
(function(){
  function copy(text){
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function(res, rej){
      var ta=document.createElement('textarea');
      ta.value=text; ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta); ta.select();
      var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      ok?res():rej(new Error('copy failed'));
    });
  }
  document.addEventListener('click', function(ev){
    var btn=ev.target.closest ? ev.target.closest('.cb-copy') : null;
    if(!btn) return;
    var block=btn.closest('.codeblock');
    var code=block && block.querySelector('pre code');
    if(!code) return;
    copy(code.textContent).then(function(){
      btn.setAttribute('data-state','done');
      clearTimeout(btn._t);
      btn._t=setTimeout(function(){ btn.removeAttribute('data-state'); }, 1600);
    }).catch(function(){
      btn.setAttribute('aria-label','Copy failed — select the code and copy manually');
    });
  });
})();

</script>
</body>
</html>
